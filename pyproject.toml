[project]
name = "zerorag"
dynamic = ["version"]
description = "A modular, production-ready Retrieval-Augmented Generation (RAG) pipeline."
readme = "README.md"
authors = [
    { name = "Michael Loukeris", email = "michael.loukeris@gmail.com" }
]
maintainers = [
   { name = "Michael Loukeris", email = "michael.loukeris@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.3.1",
    "fastembed>=0.6.1",
    "langchain>=1.2.13",
    "langchain-community>=0.4.1",
]
license = "Apache-2.0"
license-files = ["LICEN[CS]E*"]
keywords = ["rag", "llm", "zerorag", "vector-database", "ai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.urls]
repository = "https://github.com/donMichaelL/zerorag"
"Bug Tracker" = "https://github.com/donMichaelL/zerorag/issues"
changelog = "https://github.com/donMichaelL/zerorag/blob/master/CHANGELOG.md"

[project.scripts]
zerorag = "zerorag.cli:cli"

[project.optional-dependencies]
pdf = [
    "pypdf>=6.9.1",
]
docx = [
    "docx2txt>=0.9",
]
chromadb = [
    "chromadb>=1.0.0",
    "langchain-chroma>=0.2.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zerorag"]

[tool.ruff]
line-length = 119
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "C4", "TID", "T20", "INP", "UP", "I", "S", "TCH"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "INP001"]

[tool.hatch.version]
source = "vcs"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=zerorag --cov-report=term-missing --cov-report=html --cov-report=xml --cov-fail-under=75"

[tool.tox]
requires = ["tox>=4", "tox-uv>=1.0"]
env_list = ["3.12", "3.13"]

[tool.tox.env_run_base]
description = "run the tests with pytest under {base_python}"
dependency_groups = ["test"]
extras = ["pdf", "docx"]
commands = [
    ["pytest", "{posargs:tests}"],
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
]
test = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "tox>=4.49.1",
]
